name: Deploy Dashboard

# Fully automated: regenerate backtest + live-signal snapshot (Python) ->
# build React (Vite) -> deploy to Pages. Runs on every relevant push AND on a
# 15-minute schedule, so the static dashboard keeps near-live signals without
# any server.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'gen_report.py'
      - 'live_signals.py'
      - 'news_feed.py'
      - 'forex_signals.py'
      - 'mind_shot/**'
      - 'tests/fixtures/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '*/15 * * * *'   # UTC; GitHub may delay scheduled runs a few minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate backtest data from the live engine
        run: python gen_report.py        # writes web/public/backtest.json (pure stdlib)

      - name: Generate live-signal snapshot with the same Python engine
        run: |
          python live_signals.py > /tmp/signals.json \
            && mv /tmp/signals.json web/public/signals.json \
            || echo "::warning::live feed unavailable — keeping the last committed signals.json"

      - name: Generate economic-news snapshot (TradingView + GitHub feed)
        run: |
          if python news_feed.py --require-events > /tmp/news.json; then
            mv /tmp/news.json web/public/news.json
          else
            echo "::warning::news feed has no upcoming high/medium events — keeping the last committed news.json"
          fi

      - name: Generate forex scan snapshot (Yahoo 1h → 4h + news gate)
        run: |
          if python forex_signals.py --require-data > /tmp/forex.json; then
            mv /tmp/forex.json web/public/forex.json
          else
            echo "::warning::forex scan returned fewer than 2 pairs — keeping the last committed forex.json"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
